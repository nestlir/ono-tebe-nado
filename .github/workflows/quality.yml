name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'refactor/**'

permissions:
  contents: read

jobs:
  quality:
    name: CSS quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run CSS lint
        run: npm run lint:css
