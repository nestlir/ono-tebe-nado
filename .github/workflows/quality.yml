name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/**

permissions:
  contents: read

jobs:
  quality:
    name: Format and CSS checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run quality checks
        run: npm run check
